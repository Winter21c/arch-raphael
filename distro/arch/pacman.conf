#
# /etc/pacman.conf —— Arch Linux ARM (aarch64)
#
# 由 distro/arch/distro.sh:distro_bootstrap 安装到镜像的 /etc/pacman.conf。
# 仓库集合与 ALARM 官方 pacman.conf 一致（core/extra/alarm/aur）；
# 具体镜像地址来自 /etc/pacman.d/mirrorlist（同函数生成，可用 ALARM_MIRROR 覆盖首选项）。
#
# DisableSandbox*：镜像在 docker / qemu-user chroot 里构建，Landlock 沙箱常不可用，
# 关掉可避免每个事务刷警告（pacman 7 的选项名，ALARM 7.1.0 已确认支持）。
#
[options]
HoldPkg     = pacman glibc
Architecture = aarch64
CheckSpace
Color
VerbosePkgLists
ParallelDownloads = 5
DisableSandboxFilesystem
DisableSandboxSyscalls

# 包与数据库均验签；因此 mirrorlist 里使用 http 镜像同样安全
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[alarm]
Include = /etc/pacman.d/mirrorlist

[aur]
Include = /etc/pacman.d/mirrorlist
