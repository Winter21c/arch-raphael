#!/usr/bin/env bash
# 各发行版的差异参数（build.sh 解析发行版后调用 distro_config）

distro_config() {
    case "$1" in
        arch)
            : "${DISTRO_NAME:=Arch Linux ARM}"
            export DISTRO_ID="arch"
            [ "${IMAGE_SIZE_EXPLICIT:-0}" = "1" ] || IMAGE_SIZE="10G"
            : "${ROOTFS_URL:=http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz}"
            : "${CONTAINER_IMAGE:=debian:trixie-slim}"
            export PKG_MANAGER="pacman"
            export INITRAMFS="mkinitcpio"
            ;;
        fedora)
            : "${DISTRO_NAME:=Fedora 44}"
            export DISTRO_ID="fedora"
            [ "${IMAGE_SIZE_EXPLICIT:-0}" = "1" ] || IMAGE_SIZE="12G"
            : "${CONTAINER_IMAGE:=fedora:44}"
            export PKG_MANAGER="dnf"
            export INITRAMFS="dracut"
            : "${FEDORA_RELEASE:=44}"
            ;;
        *)
            echo "未知发行版: $1（支持 arch | fedora）" >&2
            return 1
            ;;
    esac
    export DISTRO_NAME IMAGE_SIZE ROOTFS_URL CONTAINER_IMAGE FEDORA_RELEASE
}