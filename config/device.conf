#!/usr/bin/env bash
# ============================================================================
# 设备与镜像基础参数（所有脚本共享）
# 使用 ${VAR:=默认值}：外部已设置的环境变量优先（CI 通过 env 覆盖）
# 参考：linux-xiaomi-raphael-uboot（Nura / postmarketOS 分区方案）
# ============================================================================
: "${DEVICE_NAME:=xiaomi-raphael}"
: "${DEVICE_MODEL:=Redmi K20 Pro}"
: "${HOSTNAME_DEFAULT:=raphael}"

# 默认账号（首次启动后请立即修改）
: "${USER_NAME:=user}"
: "${USER_PASS:=1234}"
: "${ROOT_PASS:=1234}"

# ---- 镜像几何（不可随意改动，需与 U-Boot 的读取方式一致）-------------------
: "${IMAGE_NAME:=rootfs.img}"
# 镜像大小：外部环境变量优先；否则由 config/distro.conf 按发行版给默认值
if [ -n "${IMAGE_SIZE:-}" ]; then
    IMAGE_SIZE_EXPLICIT=1
else
    IMAGE_SIZE_EXPLICIT=0
    IMAGE_SIZE=8G
fi
: "${SECTOR_SIZE:=4096}"              # UFS 逻辑扇区，必须为 4096
: "${BOOT_PART_START:=2048}"          # 8MiB 对齐
: "${BOOT_SIZE:=512M}"                # ESP（FAT32）：内核 + initramfs + systemd-boot
: "${BOOT_LABEL:=Boot}"
: "${BOOT_VOLID:=1BF4A32B}"
: "${ROOT_LABEL:=Root}"
: "${ROOT_UUID:=ee8d3593-59b1-480e-a3b6-4fefb17ee7d8}"
: "${ESP_PART_TYPE:=c12a7328-f81f-11d2-ba4b-00a0c93ec93b}"
: "${ROOT_PART_TYPE:=b921b045-1df0-41c3-af44-4c6f280d3fae}"

# ---- btrfs 布局 -----------------------------------------------------------
: "${BTRFS_COMPRESS:=zstd:3}"
: "${BTRFS_OPTS:=subvol=@,compress=zstd:3,noatime,ssd,discard=async}"
: "${BTRFS_HOME_OPTS:=subvol=@home,compress=zstd:3,noatime,ssd,discard=async}"

# ---- 内核 / 固件（预编译，设备相关）---------------------------------------
: "${KERNEL_VERSION:=7.3}"
: "${KERNEL_DEB_REPO:=GengWei1997/kernel-deb}"

# ---- 桌面 ----------------------------------------------------------------
: "${COMPOSITOR:=niri}"                 # niri（默认）| sway
: "${SCREEN_ROTATION:=90}"              # 手机默认横屏：90 / 270
: "${FBCON_ROTATE:=1}"                  # 控制台旋转（fbcon=rotate:N）
: "${BOOT_VERBOSE:=1}"                 # 1 = 内核启动日志打到屏幕（调试用）；发布版可设 0
: "${BOOT_SERIAL_CONSOLE:=0}"          # 1 = initramfs 里建 USB ACM 串口控制台（无屏幕排障用）
: "${DESKTOP_LANG:=zh_CN.UTF-8}"
: "${DESKTOP_TZ:=Asia/Shanghai}"
: "${INSTALL_IME:=1}"
: "${DUX_SHELL_VERSION:=2.1.2}"
: "${DUX_GREETER_VERSION:=2.1.2}"

# ---- 构建行为 ------------------------------------------------------------
: "${JOBS:=4}"
: "${CACHE_DIR:=$PWD/cache}"
: "${WORK_DIR:=$PWD/work}"
: "${MNT:=$WORK_DIR/rootdir}"
: "${IMAGE_PATH:=$PWD/$IMAGE_NAME}"
: "${COMPRESS_IMAGE:=1}"

# Fedora 源码构建 quickshell 后会卸掉编译依赖（约省 600-800MB）；1 = 保留
export QS_KEEP_DEPS="${QS_KEEP_DEPS:-0}"
export IMAGE_SIZE_EXPLICIT
export DEVICE_NAME DEVICE_MODEL HOSTNAME_DEFAULT USER_NAME USER_PASS ROOT_PASS \
       IMAGE_NAME IMAGE_SIZE SECTOR_SIZE BOOT_PART_START BOOT_SIZE BOOT_LABEL \
       BOOT_VOLID ROOT_LABEL ROOT_UUID ESP_PART_TYPE ROOT_PART_TYPE \
       BTRFS_COMPRESS BTRFS_OPTS BTRFS_HOME_OPTS \
       KERNEL_VERSION KERNEL_DEB_REPO \
       COMPOSITOR SCREEN_ROTATION FBCON_ROTATE BOOT_VERBOSE BOOT_SERIAL_CONSOLE DESKTOP_LANG DESKTOP_TZ INSTALL_IME \
       DUX_SHELL_VERSION DUX_GREETER_VERSION \
       JOBS CACHE_DIR WORK_DIR MNT IMAGE_PATH COMPRESS_IMAGE
